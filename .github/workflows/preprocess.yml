name: Preprocessing Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn matplotlib seaborn numpy

      - name: Run preprocessing script
        run: |
          python preprocessing/automate_Risma.py

      - name: Commit preprocessing result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/adult_income_dataset_preprocessing/adult_income_dataset_preprocessing.csv
          git add preprocessing/adult_income_dataset_preprocessing/adult_income_dataset_preprocessing_test.csv
          git commit -m "Add preprocessed datasets" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main